<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${device.id == null ? 'Add Device' : 'Edit Device'}"></title>
</head>
<body>
    <form th:object="${device}" th:action=" @{/add}" method="post">
        <div><h2 th:text="${device.id == null ? 'Add Device' : 'Edit Device'}"></h2></div>
        <div>
            <div th:if="${#fields.hasErrors('deviceName')}">
                <p style="color: red;" th:errors="*{deviceName}"></p>
            </div>
            <label for="deviceName">DeviceName:</label>
            <input type="text" th:field="*{deviceName}" id="deviceName">
        </div>
        <div>
            <div th:if="${#fields.hasErrors('brand')}">
                <p style="color: red;" th:errors="*{brand}"></p>
            </div>
            <label for="brand">Brand:</label>
            <input type="text" th:field="*{brand}" id="brand">
        </div>
        <div>
            <div th:if="${#fields.hasErrors('price')}">
                <p style="color: red;" th:errors="*{price}"></p>
            </div>
            <label for="price">Price:</label>
            <input type="number" step="0.01" th:field="*{price}" id="price">
        </div>
        <div>
            <label for="url">DeviceImage URL:</label>
            <input type="text" th:field="*{url}" id="url">
        </div>
        <div>
            <button type="submit">Save</button>
            <a th:href="@{/deviceList}">Cancel</a>
        </div>
    </form>
</body>
</html>
